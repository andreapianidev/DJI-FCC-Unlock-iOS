name: FreeFCC
options:
  bundleIdPrefix: com.andreapiani
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "27.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ERAK83QBBM
    MARKETING_VERSION: "1.8.1"
    CURRENT_PROJECT_VERSION: "11"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  FreeFCC:
    type: application
    platform: iOS
    sources:
      - path: FreeFCC
        excludes:
          - "Resources/profiles"
      # Folder reference, so the profiles keep their directory inside the
      # bundle and stay readable as the plain JSON files they are.
      - path: FreeFCC/Resources/profiles
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreapiani.freefcc
        PRODUCT_NAME: FreeFCC
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FreeFCC/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  FreeFCCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FreeFCCTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreapiani.freefcc.tests
        PRODUCT_NAME: FreeFCCTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FreeFCC.app/FreeFCC"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: FreeFCC

schemes:
  FreeFCC:
    build:
      targets:
        FreeFCC: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FreeFCCTests
    archive:
      config: Release
